
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            width: 350px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .buttons {
            margin-top: 15px;
        }

        button {
            width: 55px;
            padding: 12px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #667eea;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #4b5fc7;
        }

        #hasil {
            margin-top: 20px;
            padding: 12px;
            background: #f0f2f5;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Kalkulator Sederhana</h2>

        <!-- Input angka pertama -->
        <input type="number" id="angka1"
            placeholder="Masukkan angka pertama">

        <!-- Input angka kedua -->
        <input type="number" id="angka2"
            placeholder="Masukkan angka kedua">

        <!-- Tombol operasi -->
        <div class="buttons">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung('*')">*</button>
            <button onclick="hitung('/')">/</button>
        </div>

        <!-- Menampilkan hasil -->
        <div id="hasil">Hasil: -</div>

    </div>

    <script>
        function hitung(operator) {

            // Mengambil nilai dari input
            let angka1 = document.getElementById("angka1").value;
            let angka2 = document.getElementById("angka2").value;

            let hasil;

            // Validasi input
            if (angka1 === "" || angka2 === "") {
                document.getElementById("hasil").textContent =
                    "Silakan masukkan kedua angka!";
                return;
            }

            // Mengubah input menjadi angka
            angka1 = parseFloat(angka1);
            angka2 = parseFloat(angka2);

            // Melakukan operasi matematika
            if (operator === "+") {
                hasil = angka1 + angka2;
            } 
            else if (operator === "-") {
                hasil = angka1 - angka2;
            } 
            else if (operator === "*") {
                hasil = angka1 * angka2;
            } 
            else if (operator === "/") {

                if (angka2 === 0) {
                    document.getElementById("hasil").textContent =
                        "Error: Tidak bisa dibagi nol!";
                    return;
                }

                hasil = angka1 / angka2;
            }

            // Menampilkan hasil perhitungan
            document.getElementById("hasil").textContent =
                "Hasil: " + hasil;
        }
    </script>

</body>
</html>
